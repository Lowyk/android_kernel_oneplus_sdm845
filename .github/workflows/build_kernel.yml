name: Build fajita kernel (MADV_WIPEONFORK backport)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev python3 python-is-python3 \
            build-essential kmod cpio rsync curl git

      - name: Fetch AOSP prebuilt clang (clang-r383902, single version dir only)
        run: |
          mkdir -p toolchain/clang
          curl -L --max-time 300 --retry 3 -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2021/clang-r383902.tar.gz"
          tar -xzf clang.tar.gz -C toolchain/clang
          echo "$PWD/toolchain/clang/bin" >> "$GITHUB_PATH"

      - name: Fetch AOSP prebuilt GCC aarch64 (for binutils/libgcc only, never as the compiler)
        run: |
          mkdir -p toolchain/gcc-aarch64
          curl -L --max-time 300 --retry 3 -o gcc-aarch64.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/master-kernel-build-2021.tar.gz"
          tar -xzf gcc-aarch64.tar.gz -C toolchain/gcc-aarch64
          echo "$PWD/toolchain/gcc-aarch64/bin" >> "$GITHUB_PATH"

      - name: Diagnose clang toolchain invocation directly (matches real -no-integrated-as build flags)
        run: |
          set -x
          which aarch64-linux-android-elfedit
          which aarch64-linux-android-as
          GCC_TOOLCHAIN_DIR="$(dirname "$(which aarch64-linux-android-elfedit)")"
          GCC_TOOLCHAIN="$(realpath "$GCC_TOOLCHAIN_DIR/..")"
          echo "GCC_TOOLCHAIN_DIR=$GCC_TOOLCHAIN_DIR  GCC_TOOLCHAIN=$GCC_TOOLCHAIN"
          echo 'int main(void){return 0;}' > /tmp/t.c
          clang --target=aarch64-linux-gnu --prefix="$GCC_TOOLCHAIN_DIR" \
            --gcc-toolchain="$GCC_TOOLCHAIN" -no-integrated-as \
            -fstack-protector-strong -c /tmp/t.c -o /tmp/t.o
          echo "DIRECT CLANG TEST (with -no-integrated-as): exit=$?"

      - name: Configure
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out ARCH=arm64 sdm845-perf_defconfig

      - name: Dump real KBUILD_CFLAGS and reproduce the failing test with visible errors
        run: |
          set -x
          MAKEARGS="O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android-"
          KCFLAGS=$(printf 'print-%%: ; @echo $($*)\n' | make -f Makefile -f /dev/stdin $MAKEARGS print-KBUILD_CFLAGS 2>&1)
          KCPPFLAGS=$(printf 'print-%%: ; @echo $($*)\n' | make -f Makefile -f /dev/stdin $MAKEARGS print-KBUILD_CPPFLAGS 2>&1)
          echo "KBUILD_CFLAGS=$KCFLAGS"
          echo "KBUILD_CPPFLAGS=$KCPPFLAGS"
          echo 'int main(void){return 0;}' > /tmp/t.c
          set +e
          clang -Werror $KCPPFLAGS $KCFLAGS -fstack-protector-strong -c -x c /tmp/t.c -o /tmp/t.o
          echo "REPRO TEST exit=$?"
          set -e

      - name: Build Image
        run: |
          set -o pipefail
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            2>&1 | tee build.log

      - name: Upload build log (always, for diagnosing failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Image
          path: out/arch/arm64/boot/Image
